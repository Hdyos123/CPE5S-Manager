<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1224">
<title>OPPO CPE</title>
<style>
  :root{
    --blue:#4aa8ff; --mint:#5fe0b0; --violet:#a06cff; --cyan:#54d8ff;
    --card:rgba(255,255,255,.085);
    --stroke:rgba(255,255,255,.16);
    --txt:#fff; --dim:rgba(255,255,255,.55); --faint:rgba(255,255,255,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,"SF Pro Rounded","PingFang SC",system-ui,sans-serif;
    background:#070b16;color:var(--txt);overflow:hidden;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  /* ---- 极光背景 ---- */
  .aurora{position:fixed;inset:-20%;z-index:0;filter:blur(46px);opacity:.95}
  .aurora i{position:absolute;display:block;border-radius:50%}
  .a1{width:70vmin;height:70vmin;left:-10%;top:-8%;background:radial-gradient(circle,rgba(64,160,255,.85),transparent 62%);animation:drift1 13s ease-in-out infinite alternate}
  .a2{width:66vmin;height:66vmin;right:-16%;top:6%;background:radial-gradient(circle,rgba(160,90,255,.8),transparent 62%);animation:drift2 16s ease-in-out infinite alternate}
  .a3{width:62vmin;height:62vmin;left:6%;bottom:-12%;background:radial-gradient(circle,rgba(40,220,200,.62),transparent 64%);animation:drift3 18s ease-in-out infinite alternate}
  .base{position:fixed;inset:0;z-index:0;background:
    radial-gradient(120% 80% at 20% 0%,rgba(30,70,140,.55),transparent 60%),
    radial-gradient(100% 70% at 90% 20%,rgba(90,50,150,.45),transparent 62%),
    linear-gradient(160deg,#0a1020 0%,#0d1226 45%,#070a14 100%)}
  @keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(9vmin,7vmin) scale(1.12)}}
  @keyframes drift2{from{transform:translate(0,0) scale(1.05)}to{transform:translate(-10vmin,9vmin) scale(.95)}}
  @keyframes drift3{from{transform:translate(0,0) scale(.98)}to{transform:translate(6vmin,-8vmin) scale(1.1)}}

  /* ---- 布局 ---- */
  .app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 10px}
  .scroll::-webkit-scrollbar{display:none}

  /* ---- 玻璃卡 ---- */
  .glass{
    position:relative;border-radius:22px;padding:16px;
    background:var(--card);
    -webkit-backdrop-filter:blur(26px) saturate(170%);
    backdrop-filter:blur(26px) saturate(170%);
    border:1px solid var(--stroke);
    box-shadow:0 10px 28px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.22);
    margin-bottom:13px;
  }
  .glass:before{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 38%,transparent 70%,rgba(255,255,255,.06))}

  .sect{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--dim);margin-bottom:12px;letter-spacing:.02em}
  .sect svg{width:13px;height:13px;opacity:.8}

  /* ---- 顶栏 ---- */
  .head{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 2px 14px}
  .head .k{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.06em}
  .head .v{font-size:25px;font-weight:700;letter-spacing:-.4px;line-height:1.15;margin-top:2px}
  .chips{display:flex;gap:7px;align-items:center}
  .pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;
    background:rgba(95,224,176,.16);color:#7ff0c6;border:1px solid rgba(95,224,176,.34)}
  .live{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:rgba(255,255,255,.85);
    padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid var(--stroke)}
  .dot{width:7px;height:7px;border-radius:50%;background:#41e07a;box-shadow:0 0 8px #41e07a;animation:pulse 2.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---- 信号 ---- */
  .signal{display:flex;gap:18px;align-items:center}
  .ring{position:relative;width:94px;height:94px;flex:0 0 94px}
  .ring svg{display:block}
  .ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .mid b{font-size:19px;font-weight:700;letter-spacing:-.3px}
  .ring .mid span{font-size:9px;font-weight:600;color:var(--faint);margin-top:1px}
  .sigbody{flex:1;min-width:0}
  .barsrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .bars{display:flex;align-items:flex-end;gap:3px;height:22px}
  .bars i{width:5px;border-radius:3px;background:rgba(255,255,255,.16)}
  .bars i.on{background:linear-gradient(180deg,#8ff5c8,#41d98d)}
  .sigbody .net{font-size:13px;font-weight:600;color:rgba(255,255,255,.88)}
  .kvrow{display:flex;gap:18px;margin-bottom:9px}
  .kv .l{font-size:9.5px;color:var(--faint);font-weight:500}
  .kv .n{font-size:14.5px;font-weight:600;margin-top:1px}
  .sim{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--faint);font-family:ui-monospace,Menlo,monospace}


  /* ---- 趋势图 ---- */
  .trend{margin-top:15px;padding-top:13px;border-top:1px solid rgba(255,255,255,.09)}
  .thead{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--faint);font-weight:600;letter-spacing:.03em;margin-bottom:7px}
  .tlegend{display:flex;align-items:center;gap:4px;font-weight:500}
  .tlegend i{width:8px;height:3px;border-radius:2px;display:inline-block;margin-left:5px}
  .tlegend i.dl{background:#54d8ff;box-shadow:0 0 6px #54d8ff88}
  .tlegend i.ul{background:#7ee08c;box-shadow:0 0 6px #7ee08c88}
  #chart{width:100%;height:74px;display:block;overflow:visible}
  #lineDl,#lineUl,#areaDl,#dotDl{transition:d .45s linear}
  .taxis{display:flex;justify-content:space-between;font-size:9px;color:rgba(255,255,255,.28);font-family:ui-monospace,Menlo,monospace;margin-top:3px}

  /* ---- 速率 ---- */
  .spd{display:flex;gap:12px;align-items:flex-start}
  .spd .col{flex:1;min-width:0}
  .spd .t{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--dim);font-weight:500}
  .spd .num{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:4px;white-space:nowrap}
  .spd .num small{font-size:12px;font-weight:600;opacity:.55;margin-left:3px}
  .spd .tot{font-size:10px;color:var(--faint);margin-top:2px}
  .vsep{width:1px;align-self:stretch;background:rgba(255,255,255,.12);margin:2px 0}
  .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;display:flex;margin-top:14px}
  .bar b{display:block;height:100%;background:linear-gradient(90deg,#54d8ff7a,#54d8ff);transition:width .6s ease}
  .bar i{display:block;height:100%;background:rgba(95,224,140,.55);flex:1}

  /* ---- 指标格 ---- */
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .metric .l{font-size:10.5px;color:var(--faint);font-weight:500}
  .metric .v{font-size:20px;font-weight:700;letter-spacing:-.4px;margin-top:3px;white-space:nowrap}
  .metric .v.sm{font-size:15.5px;letter-spacing:.2px;font-family:ui-monospace,Menlo,monospace}
  .grid3{align-items:start}

  /* ---- 设备列表 ---- */
  .dev{display:flex;align-items:center;gap:10px;padding:7px 0}
  .dev .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
  .dev .ic svg{width:15px;height:15px;opacity:.8}
  .dev .nm{font-size:13px;font-weight:500}
  .dev .sub{font-size:10px;color:var(--faint);font-family:ui-monospace,Menlo,monospace;margin-top:1px}

  /* ---- 底栏 ---- */
  .tabbar{display:flex;gap:2px;margin:0 12px 8px;padding:6px;border-radius:24px;
    background:rgba(255,255,255,.08);
    -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
    border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25)}
  .tabbar button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.5);font:inherit;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;transition:.25s}
  .tabbar button svg{width:18px;height:18px}
  .tabbar button span{font-size:9.5px;font-weight:500}
  .tabbar button.on{color:#fff;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
</style>
</head>
<body>
<div class="base"></div>
<div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

<div class="app">
  <div class="scroll">
    <div class="head">
      <div>
        <div class="k">OPPO CPE</div>
        <div class="v">中国联通</div>
      </div>
      <div class="chips">
        <div class="pill">5G</div>
        <div class="live"><i class="dot"></i>在线</div>
      </div>
    </div>

    <!-- 信号 -->
    <div class="glass">
      <div class="signal">
        <div class="ring">
          <svg width="94" height="94" viewBox="0 0 94 94" style="transform:rotate(-90deg)">
            <circle cx="47" cy="47" r="38" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="9"/>
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#41f0a8"/><stop offset=".5" stop-color="#54b8ff"/><stop offset="1" stop-color="#b07cff"/>
              </linearGradient>
            </defs>
            <circle id="arc" cx="47" cy="47" r="38" fill="none" stroke="url(#g1)" stroke-width="9"
              stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="60"/>
          </svg>
          <div class="mid"><b id="rsrp">-71</b><span>RSRP dBm</span></div>
        </div>
        <div class="sigbody">
          <div class="barsrow">
            <div class="bars"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
            <div class="net">5G NR · n78</div>
          </div>
          <div class="kvrow">
            <div class="kv"><div class="l">SINR</div><div class="n" id="sinr">17 dB</div></div>
            <div class="kv"><div class="l">RSRQ</div><div class="n" id="rsrq">-11 dB</div></div>
          </div>
          <div class="sim">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h8v8H8z"/></svg>
            <span id="iccid">898601****8289</span>
          </div>
        </div>
      </div>

      <div class="trend">
        <div class="thead">
          <span>速率趋势 · 近 60 秒</span>
          <span class="tlegend"><i class="dl"></i>下载 <i class="ul"></i>上传</span>
        </div>
        <svg id="chart" viewBox="0 0 320 74" preserveAspectRatio="none"></svg>
        <div class="taxis"><span id="tmax">—</span><span>now</span></div>
      </div>
    </div>

    <!-- 实时速率 -->
    <div class="glass">
      <div class="sect">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        实时速率
      </div>
      <div class="spd">
        <div class="col">
          <div class="t"><svg width="12" height="12" viewBox="0 0 24 24" fill="#54d8ff"><path d="M12 3v12m0 0 4.5-4.5M12 15 7.5 10.5M5 19h14" stroke="#54d8ff" stroke-width="2" fill="none"/></svg>下载</div>
          <div class="num" id="dn">3.47<small>Mbps</small></div>
          <div class="tot" id="dnt">累计 43.5 MB</div>
        </div>
        <div class="vsep"></div>
        <div class="col">
          <div class="t"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8ee88e" stroke-width="2"><path d="M12 21V9m0 0 4.5 4.5M12 9 7.5 13.5M5 5h14"/></svg>上传</div>
          <div class="num" id="up">1.08<small>Mbps</small></div>
          <div class="tot" id="upt">累计 61.2 MB</div>
        </div>
      </div>
      <div class="bar"><b id="dnbar" style="width:72%"></b><i></i></div>
    </div>

    <!-- 小区 -->
    <div class="glass">
      <div class="sect">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20v-8"/><circle cx="12" cy="10" r="2"/><path d="M7.5 15a6 6 0 0 1 0-8m9 0a6 6 0 0 1 0 8"/></svg>
        服务小区
      </div>
      <div class="grid3">
        <div class="metric"><div class="l">PCI</div><div class="v">96</div></div>
        <div class="metric"><div class="l">Cell ID</div><div class="v sm">20369080331</div></div>
        <div class="metric"><div class="l">PLMN</div><div class="v sm">46001</div></div>
      </div>
    </div>

    <!-- 在线设备 -->
    <div class="glass">
      <div class="sect" style="justify-content:space-between">
        <div style="display:flex;align-items:center;gap:6px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/></svg>
          在线设备
        </div>
        <div class="pill" style="background:rgba(120,180,255,.16);color:#9ccbff;border-color:rgba(120,180,255,.33)">1</div>
      </div>
      <div class="dev">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor"/></svg></div>
        <div>
          <div class="nm">iPad</div>
          <div class="sub">192.168.0.150 · 8A:99:AF:74:C7:98</div>
        </div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg><span>首页</span></button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v12H8l-4 4z"/></svg><span>短信</span></button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M5 12h14M5 17h9"/><circle cx="3" cy="7" r=".9" fill="currentColor"/><circle cx="3" cy="12" r=".9" fill="currentColor"/></svg><span>控制</span></button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20v-6"/><path d="M8.5 16a5 5 0 0 1 7 0M5.5 12.5a9.5 9.5 0 0 1 13 0"/></svg><span>锁频</span></button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>参数</span></button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.5-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.6 1z"/></svg><span>设置</span></button>
  </div>
</div>

<script>
// —— 真实抓取值 ——
const real = {
  operator: "中国联通", net: "5G", mode: "5G NR · n78",
  rsrp: -71, sinr: 17, rsrq: -11,
  pci: 96, cellId: 20369080331, plmn: "46001",
  iccid: "898601****8289",
  dev: [{ name: "iPad", ip: "192.168.0.150", mac: "8A:99:AF:74:C7:98" }]
};
const $ = s => document.querySelector(s);
$("#iccid").textContent = real.iccid;

// 实时速率：围绕实测值波动（真实固件就是 1 秒刷新 rate 字段）
let dn = 3.47e6, up = 1.08e6, dnTot = 43517974, upTot = 61195282;
const fmtRate = v => v >= 1e6 ? [(v/1e6).toFixed(2), "Mbps"] : [(v/1e3).toFixed(0), "Kbps"];
const fmtBytes = v => v >= 1048576 ? (v/1048576).toFixed(1) + " MB" : (v/1024).toFixed(0) + " KB";

function tick() {
  dn = Math.max(1.2e6, Math.min(9.9e6, dn + (Math.random() - 0.48) * 9e5));
  up = Math.max(0.4e6, Math.min(4.5e6, up + (Math.random() - 0.5) * 3.2e5));
  dnTot += Math.round(dn / 8); upTot += Math.round(up / 8);
  const [dV, dU] = fmtRate(dn), [uV, uU] = fmtRate(up);
  $("#dn").innerHTML = dV + "<small>" + dU + "</small>";
  $("#up").innerHTML = uV + "<small>" + uU + "</small>";
  $("#dnt").textContent = "累计 " + fmtBytes(dnTot);
  $("#upt").textContent = "累计 " + fmtBytes(upTot);
  $("#dnbar").style.width = Math.round(dn / (dn + up) * 100) + "%";
}

// —— 速率趋势（60 秒滚动） ——
const W = 320, H = 74, N = 60;
const dlHist = [], ulHist = [];   // 从空开始，逐秒生长
const chart = document.getElementById('chart');
const NS = 'http://www.w3.org/2000/svg';
let svgInit = false;
let chartMax = 0;

function buildSvg() {
  chart.innerHTML = '';
  const defs = document.createElementNS(NS, 'defs');
  const lg = document.createElementNS(NS, 'linearGradient');
  lg.setAttribute('id', 'fillDl'); lg.setAttribute('x1', '0'); lg.setAttribute('y1', '0');
  lg.setAttribute('x2', '0'); lg.setAttribute('y2', '1');
  lg.innerHTML = '<stop offset="0" stop-color="#54d8ff" stop-opacity=".38"/>' +
                 '<stop offset="1" stop-color="#54d8ff" stop-opacity="0"/>';
  defs.appendChild(lg);
  chart.appendChild(defs);
  ['grid1','grid2'].forEach((c, i) => {
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1','0'); l.setAttribute('x2', W);
    l.setAttribute('y1', 18 + i * 26); l.setAttribute('y2', 18 + i * 26);
    l.setAttribute('stroke', 'rgba(255,255,255,.07)');
    l.setAttribute('stroke-dasharray', '2 5');
    chart.appendChild(l);
  });
  const area = document.createElementNS(NS, 'path');
  area.setAttribute('id', 'areaDl'); area.setAttribute('fill', 'url(#fillDl)');
  chart.appendChild(area);
  ['lineDl','lineUl'].forEach(id => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('id', id); p.setAttribute('fill', 'none');
    p.setAttribute('stroke-width', '2'); p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-linejoin', 'round');
    p.setAttribute('stroke', id === 'lineDl' ? '#54d8ff' : '#7ee08c');
    p.setAttribute('opacity', id === 'lineDl' ? '1' : '.82');
    chart.appendChild(p);
  });
  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('id', 'dotDl'); dot.setAttribute('r', '3');
  dot.setAttribute('fill', '#fff'); dot.setAttribute('stroke', '#54d8ff');
  dot.setAttribute('stroke-width', '2');
  chart.appendChild(dot);
  svgInit = true;
}

function pathFrom(values, max, close) {
  if (values.length < 2) return '';
  const step = W / (N - 1);
  const pts = values.map((v, i) => [i * step, H - Math.max(2, (v / max) * (H - 6))]);
  let d = '';
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = pts[i];
    if (i === 0) { d += `M${x.toFixed(1)},${y.toFixed(1)}`; continue; }
    const [px, py] = pts[i - 1];
    const cx = (px + x) / 2;
    d += ` C${cx.toFixed(1)},${py.toFixed(1)} ${cx.toFixed(1)},${y.toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)}`;
  }
  if (close) {
    const lastX = pts[pts.length - 1][0];
    d += ` L${lastX.toFixed(1)},${H} L0,${H} Z`;
  }
  return d;
}

function drawChart() {
  if (!svgInit) buildSvg();
  // 纵轴跟随窗口内峰值，带一点余地和平滑，避免小波动被压平
  const peak = Math.max(...dlHist, ...ulHist, 1e6);
  const target = peak * 1.15;
  chartMax = chartMax === 0 ? target : chartMax + (target - chartMax) * 0.25;
  const max = chartMax;
  chart.querySelector('#lineDl').setAttribute('d', pathFrom(dlHist, max));
  chart.querySelector('#lineUl').setAttribute('d', pathFrom(ulHist, max));
  chart.querySelector('#areaDl').setAttribute('d', pathFrom(dlHist, max, true));
  const n = dlHist.length;
  const stepX = W / (N - 1);
  const lastX = (n - 1) * stepX, lastY = H - Math.max(2, (dlHist[n - 1] / max) * (H - 6));
  const dot = chart.querySelector('#dotDl');
  dot.setAttribute('cx', lastX.toFixed(1)); dot.setAttribute('cy', lastY.toFixed(1));
  document.getElementById('tmax').textContent = '峰值 ' + fmtRate(peak)[0] + ' ' + fmtRate(peak)[1];
}

// 接到 tick 上
const _tick0 = tick;
tick = function () {
  _tick0();
  dlHist.push(dn); if (dlHist.length > N) dlHist.shift();
  ulHist.push(up); if (ulHist.length > N) ulHist.shift();
  drawChart();
};

tick(); setInterval(tick, 1000);

// 信号环：RSRP -> 弧长（-120dBm 为 0，-70dBm 满）
(function () {
  const r = 38, c = 2 * Math.PI * r;
  const frac = Math.max(0.02, Math.min(1, (real.rsrp + 120) / 50));
  const arc = $("#arc");
  arc.setAttribute("stroke-dasharray", c.toFixed(1));
  arc.setAttribute("stroke-dashoffset", (c * (1 - frac)).toFixed(1));
})();
</script>
