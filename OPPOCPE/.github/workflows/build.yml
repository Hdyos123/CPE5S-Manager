name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project
        run: |
          python3 - <<'PY'
import re, sys
s = open('OPPOCPE.xcodeproj/project.pbxproj').read()
depth = 0; instr = False; esc = False
for c in s:
    if instr:
        if esc: esc = False
        elif c == '\\': esc = True
        elif c == '"': instr = False
        continue
    if c == '"': instr = True
    elif c in '({': depth += 1
    elif c in ')}': depth -= 1
    if depth < 0:
        sys.exit('unbalanced parens')
if depth != 0:
    sys.exit('unbalanced (final depth %d)' % depth)
ids = re.findall(r'^\t\t([0-9A-F]{24}) ', s, re.M)
if len(ids) != len(set(ids)):
    sys.exit('duplicate ids')
print('pbxproj OK')
PY
          xcodebuild -list -project OPPOCPE.xcodeproj

      - name: Build archive
        run: |
          xcodebuild archive \
            -project OPPOCPE.xcodeproj \
            -scheme OPPOCPE \
            -configuration Release \
            -archivePath build/OPPOCPE.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO

      - name: Package unsigned IPA
        run: |
          set -e
          APP="build/OPPOCPE.xcarchive/Products/Applications/OPPOCPE.app"
          ls -la "$APP"
          # 本地 ad-hoc 签名，方便自签重签与安装
          codesign --force --deep --sign - "$APP" || true
          rm -rf Payload Payload.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Payload.ipa Payload
          mv Payload.ipa OPPO-CPE-v1.0.0.ipa
          ls -lh OPPO-CPE-v1.0.0.ipa
          unzip -l OPPO-CPE-v1.0.0.ipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPPO-CPE-ipa
          path: OPPO-CPE-v1.0.0.ipa
          retention-days: 30
