name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, macos-14 ]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Validate project
        run: |
          python3 - <<'EOF'
          s = open('CPE5S.xcodeproj/project.pbxproj').read()
          stack = []; in_str = False; esc = False
          for ch in s:
              if in_str:
                  if esc: esc = False
                  elif ch == '\\': esc = True
                  elif ch == '"': in_str = False
                  continue
              if ch == '"': in_str = True
              elif ch in '{(': stack.append(ch)
              elif ch in '})':
                  want = '{' if ch == '}' else '('
                  assert stack and stack.pop() == want, 'unbalanced'
          assert not stack, 'unclosed'
          print('pbxproj OK')
          EOF
          xcodebuild -list -project CPE5S.xcodeproj

      - name: Build archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CPE5S.xcodeproj \
            -scheme CPE5S \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/CPE5S.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log"
          echo "---- error summary ----"
          grep -E "error:|BUILD FAILED|ARCHIVE FAILED" "$RUNNER_TEMP/build.log" | head -30 || true
          test -d "$RUNNER_TEMP/CPE5S.xcarchive"

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/CPE5S.xcarchive/Products/Applications/CPE5S.app"
          if [ ! -d "$APP" ]; then
            APP=$(find "$RUNNER_TEMP/CPE5S.xcarchive" -name "*.app" -maxdepth 5 | head -1)
          fi
          echo "APP=$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "CPE5S-${{ matrix.os }}.ipa" Payload
          ls -lh "CPE5S-${{ matrix.os }}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: IPA-${{ matrix.os }}
          path: ${{ runner.temp }}/CPE5S-${{ matrix.os }}.ipa
          retention-days: 14
