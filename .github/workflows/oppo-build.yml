name: Build OPPO CPE IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project
        working-directory: OPPOCPE
        run: |
          python3 validate_pbxproj.py OPPOCPE.xcodeproj/project.pbxproj
          xcodebuild -list -project OPPOCPE.xcodeproj

      - name: Build archive
        working-directory: OPPOCPE
        run: |
          xcodebuild archive \
            -project OPPOCPE.xcodeproj \
            -scheme OPPOCPE \
            -configuration Release \
            -archivePath build/OPPOCPE.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO

      - name: Package unsigned IPA
        working-directory: OPPOCPE
        run: |
          set -e
          APP="build/OPPOCPE.xcarchive/Products/Applications/OPPOCPE.app"
          ls -la "$APP"
          codesign --force --deep --sign - "$APP" || true
          rm -rf Payload Payload.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Payload.ipa Payload
          mv Payload.ipa OPPO-CPE-v1.0.0.ipa
          ls -lh OPPO-CPE-v1.0.0.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPPO-CPE-ipa
          path: OPPOCPE/OPPO-CPE-v1.0.0.ipa
          retention-days: 30
